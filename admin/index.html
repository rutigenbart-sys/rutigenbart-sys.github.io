a{color:var(--br)}

header b{font-size:1.05rem;letter-spacing:.02em}
header .sp{flex:1}
button,.btn{font:inherit;color:var(--tx);background:#20242a;border:1px solid var(--line);border-radius:8px;padding:9px 14px;cursor:pointer}
button:hover{border-color:#444a53}
button.pri{background:linear-gradient(180deg,#f2f4f6,#aeb4bb);color:#101214;font-weight:600;border-color:transparent}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;color:var(--tx);background:#0f1113;border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
input:focus{outline:2px solid #59616c;outline-offset:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:520px;margin:40px auto}
.box h1{margin:0 0 6px;font-size:1.35rem}
.box p{color:var(--mu);margin:6px 0 14px}
label{display:block;margin:12px 0 5px;color:#cfd4da;font-size:.9rem}
.err{color:var(--er);min-height:1.3em;margin-top:10px}
.ok{color:var(--ok)}

.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0 12px}
.bar input[type=search]{max-width:280px}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button{padding:7px 12px;font-size:.9rem}
.tabs button.on{background:#2c3138;border-color:var(--br)}
.mass{display:flex;gap:8px;align-items:center;margin-left:auto}
.mass input{width:76px}
table{width:100%;border-collapse:collapse;margin-bottom:120px}
th{color:var(--mu);font-weight:500;text-align:left;font-size:.82rem;padding:8px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid #1c1f24;vertical-align:middle}
td.t{max-width:420px}
td.t a{color:var(--tx);text-decoration:none}
td.t small{display:block;color:var(--mu)}
td.n input{width:120px;text-align:right}
tr.v td.t{padding-left:22px;color:#c3c9d0;font-size:.92rem}
tr.ch td{background:#1d2218}
tr.ch input{border-color:var(--br)}
.cat{color:var(--mu);font-size:.8rem}
.save{position:fixed;left:0;right:0;bottom:0;background:#111316ee;border-top:1px solid var(--line);padding:12px 0;backdrop-filter:blur(6px)}
.save .wrap{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.save .st{color:var(--mu);flex:1;min-width:180px}
@media(max-width:640px){td.n input{width:92px}.mass{margin-left:0}th:nth-child(1){width:auto}}
.pb{padding:4px 10px;font-size:.78rem;margin-top:6px}
.pb.ch{border-color:var(--br);color:var(--br)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:20;overflow:auto;padding:20px 12px}
.md{background:var(--card);border:1px solid var(--line);border-radius:14px;max-width:980px;margin:0 auto;padding:18px}
.mh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.mh b{font-size:1.05rem;max-width:100%}
.mh .sp{flex:1}
.hint{color:var(--mu);font-size:.85rem;margin:4px 0 14px}
label.up{cursor:pointer;display:inline-block}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.pc{position:relative;background:#0f1113;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.pc.main{border-color:var(--br);box-shadow:0 0 0 1px var(--br)}
.pc img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;background:#1b1e22}
.pc .no{position:absolute;left:6px;top:6px;background:#000a;border-radius:6px;padding:1px 7px;font-size:.75rem}
.pc .nw{position:absolute;right:6px;top:6px;background:var(--ok);color:#06140d;border-radius:6px;padding:1px 7px;font-size:.7rem;font-weight:700}
.pc .ac{display:flex;justify-content:space-between;gap:2px;padding:5px}
.pc .ac button{padding:4px 0;flex:1;font-size:.85rem;border-radius:6px;line-height:1.1}
.pc .ac button.dl:hover{border-color:var(--er);color:var(--er)}

    app.innerHTML = '';
    var b = el('<div class="box"><h1>Первый вход: настройка</h1><p>Один раз привяжите этот браузер к сайту. Дальше вход — только по паролю.</p>' +
      '<details open><summary>Где взять токен GitHub (1 минута)</summary><ol>' +
      '<li>Откройте <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">github.com/settings/personal-access-tokens/new</a> (под аккаунтом rutigenbart-sys).</li>' +
      '<li>Название — «iron admin», срок — на ваш выбор (до 1 года).</li>' +
      '<li>Repository access → <b>Only select repositories</b> → rutigenbart-sys.github.io.</li>' +
      '<li>Permissions → Repository permissions → <b>Contents: Read and write</b>.</li>' +
      '<li>Generate token и скопируйте его сюда (он показывается один раз).</li></ol></details>' +
      '<label>Токен GitHub</label><input id="tk" type="password" autocomplete="off" placeholder="github_pat_…">' +
      '<label>Придумайте пароль администратора (от 8 символов)</label><input id="p1" type="password" autocomplete="new-password">' +
      '<label>Повторите пароль</label><input id="p2" type="password" autocomplete="new-password">' +
      '<div class="err" id="er"></div><p style="margin-bottom:0"><button class="pri" id="go">Сохранить и войти</button></p></div>');
    app.appendChild(b);
    b.querySelector('#go').onclick = function () {
      var t = b.querySelector('#tk').value.trim(), p1 = b.querySelector('#p1').value, p2 = b.querySelector('#p2').value, er = b.querySelector('#er');
      if (t.length < 20) { er.textContent = 'Вставьте токен целиком.'; return; }
      if (p1.length < 8) { er.textContent = 'Пароль слишком короткий.'; return; }
      if (p1 !== p2) { er.textContent = 'Пароли не совпадают.'; return; }
      er.textContent = 'Проверяю…'; token = t;
      loadRemote().then(function () { return seal(p1, t); }).then(function (o) {
        try { localStorage.setItem(LS, JSON.stringify(o)); } catch (e) { throw new Error('Браузер не даёт сохранить данные (приватный режим?).'); }
        panel();
      }).catch(function (e) { token = null; er.textContent = e.message || 'Не удалось проверить токен.'; });
    };
  }

  var fails = 0;
  function login() {
    outBtn.hidden = true; app.innerHTML = '';
    var b = el('<div class="box"><h1>Вход администратора</h1><p>Введите пароль, чтобы менять цены и фото на сайте.</p><label>Пароль</label><input id="pw" type="password" autocomplete="current-password" autofocus><div class="err" id="er"></div>' +
      '<p style="margin-bottom:0;display:flex;gap:10px;align-items:center"><button class="pri" id="go">Войти</button><button id="rs" style="margin-left:auto;font-size:.85rem">Сбросить доступ</button></p></div>');
    app.appendChild(b);
    var pw = b.querySelector('#pw'), er = b.querySelector('#er'), go = b.querySelector('#go');
    function run() {
      if (!pw.value) return; go.disabled = true; er.textContent = '';
      unseal(pw.value, stored()).then(function (t) { token = t; fails = 0; er.textContent = 'Загружаю цены…'; return loadRemote(); }).then(panel).catch(function (e) {
        token = null; fails++;
        var wait = Math.min(fails * 2, 20) * 1000;
        er.textContent = (e && e.name === 'OperationError') ? 'Неверный пароль.' : (e.message || 'Ошибка входа.');
        setTimeout(function () { go.disabled = false; }, wait / (fails > 2 ? 1 : 4)); pw.select();
      });
    }
    go.onclick = run; pw.addEventListener('keydown', function (e) { if (e.key === 'Enter') run(); });
    b.querySelector('#rs').onclick = function () { if (confirm('Удалить сохранённый доступ в этом браузере? Потребуется заново ввести токен GitHub.')) { try { localStorage.removeItem(LS); } catch (e) {} setup(); } };
    setTimeout(function () { pw.focus(); }, 50);
  }

  /* ---------- панель цен ---------- */
  function effective(p) {
    var o = J.p[p.id], r = { p: p.p, o: p.o || 0, v: {} };
    p.vs.forEach(function (v) { r.v[v.o] = { p: v.p, o: v.po || 0 }; });
    if (o) {
      if (!p.vs.length) { if (o.p != null) r.p = o.p; r.o = o.o || 0; }
      else if (o.v) p.vs.forEach(function (v) { var x = o.v[v.o]; if (x) r.v[v.o] = { p: x.p, o: x.o || 0 }; });
    }
    return r;
  }
  var view = { cat: 'all', q: '' };
  function panel() {
    outBtn.hidden = false; edits = {}; pedits = {}; app.innerHTML = '';
    var rows = CAT.map(function (p) { return { p: p, cur: effective(p) }; });
    var head = el('<div><div class="bar"><div class="tabs" id="tabs"></div><input type="search" id="q" placeholder="Поиск по названию или артикулу"><div class="mass"><span class="cat">Изменить на</span><input id="pc" type="number" step="1" placeholder="%"><button id="ap">К показанным</button></div></div>' +
      '<table><thead><tr><th>Товар</th><th style="text-align:right">Цена, ₽</th><th style="text-align:right">Старая цена, ₽</th></tr></thead><tbody id="tb"></tbody></table></div>');
    app.appendChild(head);
    var bar = el('<div class="save"><div class="wrap"><div class="st" id="st">Изменений нет</div><button id="rv">Отменить</button><button class="pri" id="sv" disabled>Сохранить на сайт</button></div></div>');
    document.body.appendChild(bar);
    var tb = head.querySelector('#tb'), tabs = head.querySelector('#tabs'), st = bar.querySelector('#st'), sv = bar.querySelector('#sv');
    [['all', 'Все']].concat(Object.keys(CATN).map(function (k) { return [k, CATN[k]]; })).forEach(function (c) {
      var b = el('<button data-c="' + c[0] + '"' + (view.cat === c[0] ? ' class="on"' : '') + '>' + c[1] + '</button>');
      b.onclick = function () { view.cat = c[0]; Array.prototype.forEach.call(tabs.children, function (x) { x.classList.toggle('on', x === b); }); draw(); };
      tabs.appendChild(b);
    });
    head.querySelector('#q').oninput = function (e) { view.q = e.target.value.toLowerCase().trim(); draw(); };

    function val(v) { v = String(v).replace(/\s/g, ''); return v === '' ? 0 : Math.round(Number(v)); }
    function changed(r) {
      var base = effective0(r.p), c = r.cur, d = false;
      if (!r.p.vs.length) d = base.p !== c.p || base.o !== c.o; else r.p.vs.forEach(function (v) { if (base.v[v.o].p !== c.v[v.o].p || base.v[v.o].o !== c.v[v.o].o) d = true; });
      return d;
    }
    function effective0(p) { return effective(p); }
    var orig = {}; rows.forEach(function (r) { orig[r.p.id] = JSON.parse(JSON.stringify(r.cur)); });
    function dirty(r) {
      var a = orig[r.p.id], c = r.cur, d = false;
      if (!r.p.vs.length) d = a.p !== c.p || a.o !== c.o; else r.p.vs.forEach(function (v) { if (a.v[v.o].p !== c.v[v.o].p || a.v[v.o].o !== c.v[v.o].o) d = true; });
      return d;
    }
    function baseL(p) { return (PJ.p[p.id] && PJ.p[p.id].l) || p.im || []; }
    function curItems(p) { return pedits[p.id] || baseL(p).map(function (f) { return { f: f }; }); }
    function photoDirty(p) {
      var it = pedits[p.id]; if (!it) return false; var b = baseL(p);
      return it.length !== b.length || it.some(function (x, i) { return x.blob || x.f !== b[i]; });
    }
    function tsrc(x) { return x.u || (x.f.indexOf('images/uploads/') === 0 ? '/' + x.f : '/' + x.f.replace('images/', 'images/small/')); }
    function openPhotos(p) {
      var items = curItems(p).map(function (x) { return Object.assign({}, x); });
      var ov = el('<div class="ov"><div class="md"><div class="mh"><b></b><span class="sp"></span><label class="btn up">+ Загрузить фото<input type="file" accept="image/*" multiple hidden></label><button id="pr">Сбросить к исходным</button><button id="px">Закрыть</button><button class="pri" id="pk">Готово</button></div>' +
        '<p class="hint">Первое фото (с рамкой) — главное: оно на карточке товара. Стрелки меняют порядок, ★ делает фото главным, ✕ убирает. После правок нажмите «Готово», а затем «Сохранить на сайт».</p><div class="pg"></div></div></div>');
      ov.querySelector('b').textContent = p.t;
      var pg = ov.querySelector('.pg'), fi = ov.querySelector('input[type=file]');
      function draw2() {
        pg.innerHTML = '';
        items.forEach(function (x, i) {
          var c = el('<div class="pc' + (i === 0 ? ' main' : '') + '"><img alt="" loading="lazy"><span class="no">' + (i + 1) + '</span>' + (x.blob ? '<span class="nw">новое</span>' : '') +
            '<div class="ac"><button class="l" title="Левее">◀</button><button class="m" title="Сделать главным">★</button><button class="r" title="Правее">▶</button><button class="dl" title="Убрать">✕</button></div></div>');
          c.querySelector('img').src = tsrc(x);
          c.querySelector('.l').onclick = function () { if (i > 0) { var t = items[i]; items[i] = items[i - 1]; items[i - 1] = t; draw2(); } };
          c.querySelector('.r').onclick = function () { if (i < items.length - 1) { var t = items[i]; items[i] = items[i + 1]; items[i + 1] = t; draw2(); } };
          c.querySelector('.m').onclick = function () { if (i > 0) { items.unshift(items.splice(i, 1)[0]); draw2(); } };
          c.querySelector('.dl').onclick = function () { items.splice(i, 1); draw2(); };
          pg.appendChild(c);
        });
        if (!items.length) pg.innerHTML = '<p class="hint">Фото нет. Загрузите хотя бы одно.</p>';
      }
      fi.onchange = function () {
        var files = Array.prototype.slice.call(fi.files); fi.value = '';
        var chain = Promise.resolve();
        files.forEach(function (f) { chain = chain.then(function () { return toWebp(f).then(function (r) { items.push({ f: null, blob: r.blob, ext: r.ext, u: URL.createObjectURL(r.blob) }); draw2(); }); }); });
        chain.catch(function (e) { alert(e.message || e); });
      };
      ov.querySelector('#pr').onclick = function () { items = (p.im || []).map(function (f) { return { f: f }; }); draw2(); };
      ov.querySelector('#px').onclick = function () { ov.remove(); };
      ov.querySelector('#pk').onclick = function () {
        if (!items.length) return alert('Оставьте хотя бы одно фото.');
        pedits[p.id] = items; if (!photoDirty(p)) delete pedits[p.id];
        ov.remove(); draw();
      };
      document.body.appendChild(ov); draw2();
    }
    function savePhotos() {
      var ids = CAT.filter(photoDirty); if (!ids.length) return Promise.resolve();
      var total = 0, done = 0, chain = Promise.resolve();
      ids.forEach(function (p) { pedits[p.id].forEach(function (x) { if (x.blob) total++; }); });
      ids.forEach(function (p) {
        pedits[p.id].forEach(function (x, i) {
          if (!x.blob) return;
          chain = chain.then(function () {
            st.textContent = 'Загружаю фото ' + (++done) + ' из ' + total + '…';
            return putBlob('images/uploads/' + p.id + '-' + Date.now().toString(36) + i + '.' + x.ext, x.blob).then(function (path) { x.f = path; x.blob = null; });
          });
        });
      });
      return chain.then(function () {
        st.textContent = 'Сохраняю порядок фото…';
        var patch = {};
        ids.forEach(function (p) {
          var l = pedits[p.id].map(function (x) { return x.f; }), o = p.im || [];
          var same = l.length === o.length && l.every(function (f, i) { return f === o[i]; });
          patch[p.id] = same ? null : { l: l, c: l[0] !== o[0] ? 1 : 0 };
        });
        return commitPhotos(patch);
      }).then(function () { ids.forEach(function (p) { delete pedits[p.id]; }); });
    }
    function count() { var n = rows.filter(dirty).length + CAT.filter(photoDirty).length; st.textContent = n ? ('Изменений: ' + n) : 'Изменений нет'; sv.disabled = !n; return n; }

    function inp(v, cb) {
      var i = el('<input inputmode="numeric" value="' + (v ? v : '') + '">');
      i.addEventListener('input', function () { cb(val(i.value), i); }); return i;
    }
    function draw() {
      tb.innerHTML = '';
      rows.forEach(function (r) {
        var p = r.p;
        if (view.cat !== 'all' && p.c !== view.cat) return;
        if (view.q && (p.t.toLowerCase().indexOf(view.q) < 0 && String(p.id).indexOf(view.q) < 0)) return;
        var tr = el('<tr class="' + (dirty(r) ? 'ch' : '') + '"><td class="t"><a href="' + p.u + '" target="_blank" rel="noopener">' + esc(p.t) + '</a><small class="cat">' + CATN[p.c] + ' · №' + p.id + '</small></td><td class="n"></td><td class="n"></td></tr>');
        tb.appendChild(tr);
        (function (p) {
          var nph = curItems(p).length, pb = el('<button class="pb' + (photoDirty(p) ? ' ch' : '') + '" type="button">Фото · ' + nph + '</button>');
          pb.onclick = function () { openPhotos(p); };
          tr.querySelector('td.t').appendChild(pb);
        })(p);
        if (!p.vs.length) {
          tr.children[1].appendChild(inp(r.cur.p, function (v) { r.cur.p = v; tr.classList.toggle('ch', dirty(r)); count(); }));
          tr.children[2].appendChild(inp(r.cur.o, function (v) { r.cur.o = v; tr.classList.toggle('ch', dirty(r)); count(); }));
        } else {
          tr.children[1].innerHTML = '<span class="cat">по вариантам ↓</span>';
          p.vs.forEach(function (v) {
            var vr = el('<tr class="v ' + (dirty(r) ? 'ch' : '') + '"><td class="t">' + esc(v.n || 'вариант') + '</td><td class="n"></td><td class="n"></td></tr>');
            vr.children[1].appendChild(inp(r.cur.v[v.o].p, function (x) { r.cur.v[v.o].p = x; tr.classList.toggle('ch', dirty(r)); count(); }));
            vr.children[2].appendChild(inp(r.cur.v[v.o].o, function (x) { r.cur.v[v.o].o = x; tr.classList.toggle('ch', dirty(r)); count(); }));
            tb.appendChild(vr);
          });
        }
      });
      count();
    }
    head.querySelector('#ap').onclick = function () {
      var pc = Number(head.querySelector('#pc').value);
      if (!pc) return alert('Введите процент, например 10 или -15.');
      var shown = rows.filter(function (r) { return (view.cat === 'all' || r.p.c === view.cat) && (!view.q || r.p.t.toLowerCase().indexOf(view.q) >= 0 || String(r.p.id).indexOf(view.q) >= 0); });
      if (!confirm('Изменить цены у ' + shown.length + ' товаров на ' + (pc > 0 ? '+' : '') + pc + '% (округление до 10 ₽)?')) return;
      var f = function (x) { return x ? Math.max(10, Math.round(x * (1 + pc / 100) / 10) * 10) : x; };
      shown.forEach(function (r) { if (!r.p.vs.length) { r.cur.p = f(r.cur.p); if (r.cur.o) r.cur.o = f(r.cur.o); } else r.p.vs.forEach(function (v) { r.cur.v[v.o].p = f(r.cur.v[v.o].p); if (r.cur.v[v.o].o) r.cur.v[v.o].o = f(r.cur.v[v.o].o); }); });
      draw();
    };
    bar.querySelector('#rv').onclick = function () { pedits = {}; rows.forEach(function (r) { r.cur = JSON.parse(JSON.stringify(orig[r.p.id])); }); draw(); };
    sv.onclick = function () {
      var bad = null, patch = {};
      rows.filter(dirty).forEach(function (r) {
        var p = r.p, c = r.cur, e;
        if (!p.vs.length) {
          if (!(c.p > 0)) bad = p.t;
          e = { p: c.p, m: null, o: c.o > c.p ? c.o : 0 };
        } else {
          var ps = p.vs.map(function (v) { return c.v[v.o].p; });
          if (ps.some(function (x) { return !(x > 0); })) bad = p.t;
          e = { p: Math.min.apply(null, ps), m: Math.max.apply(null, ps), o: 0, v: {} };
          p.vs.forEach(function (v) { var x = c.v[v.o]; e.v[v.o] = { p: x.p, o: x.o > x.p ? x.o : 0 }; });
        }
        patch[p.id] = e;
      });
      if (bad) return alert('Укажите цену больше нуля: ' + bad);
      var hasPrice = Object.keys(patch).length > 0;
      sv.disabled = true; st.textContent = 'Сохраняю…';
      function attempt(retry) {
        var next = { v: 1, p: Object.assign({}, J.p, patch) };
        return commit(next).then(function () { J = next; }).catch(function (e) {
          if (retry && (e.status === 409 || e.status === 422)) return loadRemote().then(function () { return attempt(false); });
          throw e;
        });
      }
      savePhotos().then(function () { return hasPrice ? attempt(true) : null; }).then(function () {
        rows.forEach(function (r) { orig[r.p.id] = JSON.parse(JSON.stringify(r.cur)); });
        draw(); st.innerHTML = '<span class="ok">Сохранено. Цены и фото на сайте обновятся через 1–2 минуты.</span>';
      }).catch(function (e) { sv.disabled = false; st.innerHTML = '<span style="color:var(--er)">Не удалось сохранить: ' + esc(e.message || e) + '</span>'; });
    };
    draw();
  }
  outBtn.onclick = function () { token = null; J = { p: {} }; var s = document.querySelector('.save'); if (s) s.remove(); login(); };

  if (!window.crypto || !crypto.subtle) { app.innerHTML = '<div class="box"><h1>Нужен защищённый браузер</h1><p>Откройте страницу по https://ironshop.moscow/admin/ в современном браузере.</p></div>'; return; }
  if (stored()) login(); else setup();
})();
</script>
</body></html>
